[package]
name = "dx-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
dx-types = { version = "0.1.0", path = "../types" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmp-serde = "1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29.0"

[[bin]]
name = "dx-load"
path = "src/bin/dx-load.rs"
