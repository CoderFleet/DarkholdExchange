[package]
name = "dx-admin"
version = "0.1.0"
edition = "2024"
 
[dependencies]
axum = "0.8.9"
dx-auth = { version = "0.1.0", path = "../auth" }
dx-types = { version = "0.1.0", path = "../types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
 
[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.54.0", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }