[package]
name = "dx-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dx-admin = { version = "0.1.0", path = "../admin" }
dx-auth = { version = "0.1.0", path = "../auth" }
dx-core = { version = "0.1.0", path = "../core" }
dx-limits = { version = "0.1.0", path = "../limits" }
dx-pow = { version = "0.1.0", path = "../pow" }
dx-ledger = { version = "0.1.0", path = "../ledger" }
dkx-escrow = { version = "0.1.0", path = "../dkx-escrow" }
dx-solvency = { version = "0.1.0", path = "../solvency" }
dx-store = { version = "0.1.0", path = "../store" }
dx-types = { version = "0.1.0", path = "../types" }
dkx-wal = { version = "0.1.0", path = "../dkx-wal" }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std"] }
futures-util = "0.3"
hex = "0.4"
hdrhistogram = { version = "7", default-features = false }
rmp-serde = "1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }