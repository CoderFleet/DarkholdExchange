[package]
name = "dx-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dx-admin = { version = "0.1.0", path = "../admin" }
dx-auth = { version = "0.1.0", path = "../auth" }
dx-core = { version = "0.1.0", path = "../core" }
dx-solvency = { version = "0.1.0", path = "../solvency" }
dx-types = { version = "0.1.0", path = "../types" }
futures-util = "0.3"
hex = "0.4"
hdrhistogram = { version = "7", default-features = false }
rmp-serde = "1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
