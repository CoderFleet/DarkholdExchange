[package]
name = "dx-store"
version = "0.1.0"
edition = "2024"

[dependencies]
dx-admin = { version = "0.1.0", path = "../admin" }
dx-auth = { version = "0.1.0", path = "../auth" }
dx-types = { version = "0.1.0", path = "../types" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
tokio = { version = "1.54.0", features = ["rt", "macros"] }