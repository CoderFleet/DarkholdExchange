[package]
name = "dkx-projection"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
dx-ledger = { version = "0.1.0", path = "../ledger" }
dkx-escrow = { version = "0.1.0", path = "../dkx-escrow" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "bigdecimal"] }
tokio = { version = "1.54", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
