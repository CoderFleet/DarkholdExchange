services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: darkhold
      POSTGRES_PASSWORD: darkhold
      POSTGRES_DB: darkhold
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkhold"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
